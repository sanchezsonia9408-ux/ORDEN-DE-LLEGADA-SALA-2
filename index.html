<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orden de Llegada</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .contenedor {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .encabezado {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      color: #174ea6;
      font-size: 30px;
    }

    .subtitulo {
      margin-top: 8px;
      color: #6b7280;
      font-size: 15px;
    }

    .formulario {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #174ea6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #123d80;
    }

    .tabla-contenedor {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #174ea6;
      color: white;
      padding: 15px;
      text-align: left;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 16px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .numero {
      font-weight: bold;
      color: #174ea6;
      width: 80px;
    }

    .vacio {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .contenedor {
        padding: 15px;
      }

      h1 {
        font-size: 24px;
      }

      th, td {
        padding: 12px 8px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="encabezado">
      <h1>ORDEN DE LLEGADA</h1>
      <div class="subtitulo">Registro de pacientes</div>
    </div>

    <div class="formulario">

      <label for="nombre">Nombre completo</label>

      <input
        type="text"
        id="nombre"
        placeholder="Escriba el nombre completo"
        autocomplete="off"
      >

      <button onclick="registrarPaciente()">
        REGISTRAR LLEGADA
      </button>

    </div>

    <div class="tabla-contenedor">

      <table>
        <thead>
          <tr>
            <th>N.º</th>
            <th>NOMBRE COMPLETO</th>
            <th>HORA DE LLEGADA</th>
          </tr>
        </thead>

        <tbody id="listaPacientes">
          <tr>
            <td colspan="3" class="vacio">
              No hay pacientes registrados.
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

  <script>

    let pacientes = [];

    function registrarPaciente() {

      const campo = document.getElementById("nombre");
      const nombre = campo.value.trim();

      if (nombre === "") {
        alert("Por favor, escriba el nombre completo.");
        campo.focus();
        return;
      }

      const ahora = new Date();

      const hora = ahora.toLocaleTimeString("es-ES", {
        hour: "2-digit",
        minute: "2-digit"
      });

      pacientes.push({
        nombre: nombre,
        hora: hora
      });

      campo.value = "";

      mostrarPacientes();

      campo.focus();
    }

    function mostrarPacientes() {

      const lista = document.getElementById("listaPacientes");

      if (pacientes.length === 0) {
        lista.innerHTML = `
          <tr>
            <td colspan="3" class="vacio">
              No hay pacientes registrados.
            </td>
          </tr>
        `;
        return;
      }

      lista.innerHTML = "";

      pacientes.forEach((paciente, indice) => {

        const fila = document.createElement("tr");

        fila.innerHTML = `
          <td class="numero">${indice + 1}</td>
          <td>${paciente.nombre}</td>
          <td>${paciente.hora}</td>
        `;

        lista.appendChild(fila);

      });
    }

  </script>

</body>
</html>
